[project]
name = "negotiation-agent"
version = "0.1.0"
description = "Agent service: policy, mandate validator, policy signer, key holder. Run as two isolated instances."
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
# docs/architecture.md 3.3: no database and no RPC. The absence of sqlalchemy, asyncpg and
# web3 from this list is the structural half of that boundary; the import test is the other.
dependencies = [
    "negotiation-protocol",
    "fastapi>=0.118",
    "uvicorn[standard]>=0.37",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "anthropic>=0.75",
    "eth-account>=0.13",
    "httpx>=0.28",
    "structlog>=25.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]
