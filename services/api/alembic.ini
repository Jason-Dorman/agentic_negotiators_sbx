# Alembic's own command line, for writing a new migration:
#
#     DATABASE_URL=... uv run alembic -c services/api/alembic.ini revision --autogenerate -m "..."
#
# Applying migrations goes through `python -m api.db.migrate`, which finds the scripts inside the
# installed package and takes the URL from DATABASE_URL (docs/runbook.md). Nothing in this file is
# a secret: the URL is never written here.

[alembic]
script_location = %(here)s/src/api/db/migrations
file_template = r%%(rev)s_%%(slug)s
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
