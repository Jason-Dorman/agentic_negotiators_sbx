[project]
name = "negotiation-api"
version = "0.1.0"
description = "Backend: run controller, turn executor, observation builder, relay, indexer, projection, evidence."
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "negotiation-protocol",
    "fastapi>=0.118",
    "uvicorn[standard]>=0.37",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "sqlalchemy[asyncio]>=2.0.40",
    "alembic>=1.16",
    "asyncpg>=0.30",
    "web3>=7.8",
    "eth-account>=0.13",
    "httpx>=0.28",
    "sse-starlette>=2.3",
    "structlog>=25.4",
]

[project.scripts]
# docs/architecture.md 3.6: the batch evaluator is a CLI in this package.
negotiation-eval = "api.eval.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]
