# CI gates, one job per row of docs/test_strategy.md section 10.
#
# Stage 0 wires up the jobs that have something to check today: format and lint, the secret
# scan, and the three empty test suites. The rest are declared here with the stage that fills
# them and carry `if: false`, so they report as *skipped* rather than green. That distinction is
# the point: a gate that goes green without running is worse than one that is absent, because
# it is believed. Remove the `if: false` in the stage named on the job, not before.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FOUNDRY_VERSION: v1.8.3

jobs:
  # ------------------------------------------------------------------------------------
  # Gate: Secret scan                                                   blocks merge
  # ------------------------------------------------------------------------------------
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so a secret added and reverted in the same branch is still visible.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-groups --all-extras
      - name: Hex private keys, sk-ant- prefixes, keystore JSON
        run: uv run python infra/scripts/secret_scan.py
      - name: SPDX identifier on every Solidity source (ADR-032)
        run: uv run python infra/scripts/check_spdx.py

  # ------------------------------------------------------------------------------------
  # Gate: Format and lint (ruff, mypy strict, eslint, prettier, forge fmt)  blocks merge
  # ------------------------------------------------------------------------------------
  lint-python:
    name: Lint — Python (ruff, mypy --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-groups --all-extras
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy .

  lint-web:
    name: Lint — TypeScript (eslint, prettier, tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Enable pnpm
        run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run typecheck

  lint-contracts:
    name: Lint — Solidity (forge fmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - run: forge fmt --check --root contracts

  # ------------------------------------------------------------------------------------
  # Gate: Python unit and integration (Anvil + PostgreSQL)                 blocks merge
  # PostgreSQL is added with the backend integration suite in stage 2. Anvil is needed from
  # stage 1: the reconstruction tests (A15) start their own on a free port, run the real deploy
  # script, drive a real negotiation and reconstruct it. They skip with a clear message when
  # Foundry is absent, which is why the toolchain is installed here rather than left to chance.
  # ------------------------------------------------------------------------------------
  test-python:
    name: Test — Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - run: uv sync --all-groups --all-extras
      # The protocol fixture tests and the deploy script both read the Foundry build output.
      - run: forge build --root contracts
      - run: uv run pytest

  # ------------------------------------------------------------------------------------
  # Gates: Contract unit and short invariant; Protocol fixtures; Web unit  blocks merge
  # ------------------------------------------------------------------------------------
  test-contracts:
    name: Test — contracts (unit and short invariant)
    runs-on: ubuntu-latest
    env:
      FOUNDRY_PROFILE: ci
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - run: forge build --root contracts
      - run: forge test --root contracts -vvv

  # The two committed files in packages/protocol that are generated rather than written. A stale
  # copy is worse than an absent one: the indexer would decode events against an ABI the contract
  # no longer has, and the cross-language digest check would be comparing against a fixture for a
  # protocol nobody is running. Both generators are deterministic, so regenerate-and-diff is the
  # whole check.
  protocol-artefacts:
    name: Protocol artefacts are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - run: uv sync --all-groups --all-extras
      - run: forge build --root contracts
      - name: ABI artefacts match the build
        run: uv run python packages/protocol/tools/export_abi.py --check
      # A changed fixture means the domain, a type string or the configHash encoding changed, which
      # is a protocol version bump and a new deployment (docs/protocol.md section 15) — never a
      # quiet regeneration.
      - name: EIP-712 fixture matches its generator
        run: |
          uv run python packages/protocol/tools/generate_eip712_fixtures.py
          git diff --exit-code -- packages/protocol/fixtures/eip712.v1.json

  test-web:
    name: Test — web and protocol (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Enable pnpm
        run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test

  # ------------------------------------------------------------------------------------
  # Gates not yet earned. Skipped, never green, until the stage named on each wires it up.
  # None of these may be made a required check before then.
  # ------------------------------------------------------------------------------------
  import-boundaries:
    name: Import boundaries (stage 2)
    if: false # .importlinter is written; the modules it names arrive in stage 2.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --all-groups --all-extras
      - run: uv run lint-imports

  isolation:
    name: Isolation and leakage suite — A12 (stage 3)
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --all-groups --all-extras
      - run: uv run pytest -m isolation

  # docs/test_strategy.md section 10: 100 percent lines on NegotiationExchange, 100 percent
  # branches on the agent validator and signer, 85 percent lines on the backend (confirmed by the
  # product owner on 21 September 2026). The contract half is enforced from stage 1, when the
  # contract exists; the other two are turned on with the code they measure.
  coverage-contracts:
    name: Coverage — NegotiationExchange, 100 percent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-groups --all-extras
      - name: forge coverage, with the thresholds asserted
        run: |
          # Redirected, not piped. `run:` is `bash -e` without `-o pipefail`, so
          # `forge coverage | tee` would hand the step tee's exit status and a failing `forge`
          # would reach the threshold check as an empty report.
          forge coverage --root contracts --no-match-coverage "(test|script)/" \
            --report summary > coverage.txt
          cat coverage.txt
      # The assertion is a script with its own tests, not a heredoc. A gate whose logic cannot be
      # tested is one that is believed rather than known, and the failure that matters here is a
      # missing row reading as a pass.
      - run: uv run python infra/scripts/check_contract_coverage.py coverage.txt

  coverage:
    name: Coverage thresholds — agent and backend (stage 2)
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: echo "Wired up with the code it measures."

  # docs/test_strategy.md section 4.3. The snapshot covers the deterministic unit tests only:
  # fuzz and invariant gas figures move with the seed, so including them would make the gate
  # report noise as a regression. Tolerance is the 10 percent the test strategy names; a genuine
  # regression past that is overridable only by a decision-log entry.
  gas-snapshot:
    name: Gas snapshot regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      # The snapshot file is named explicitly. `--root` governs where the project is, but the
      # snapshot path resolves against the working directory, so the bare form read a
      # non-existent `.gas-snapshot` at the repository root and this gate failed for that reason
      # rather than for a gas regression.
      - run: >
          forge snapshot --check contracts/.gas-snapshot --tolerance 10
          --no-match-path "test/invariant/*" --root contracts

  e2e:
    name: Playwright E2E (stage 4)
    if: false # Gates merge to main once the interface exists.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: echo "Wired up with the interface in stage 4."
