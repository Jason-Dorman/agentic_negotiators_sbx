# docs/contributing.md 2.3 and docs/architecture.md 10.
# Optimizer settings are recorded in the deployment manifest, so changing anything in this
# profile changes the deployed artefact and belongs in a decision-log entry (ADR-033).

[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "ipfs"
fs_permissions = [{ access = "read-write", path = "./out" }]
gas_reports = ["NegotiationExchange", "MockERC20"]

[profile.ci]
verbosity = 3
fuzz = { runs = 1024 }
invariant = { runs = 256, depth = 32, fail_on_revert = false }

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 64
depth = 32
fail_on_revert = false

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"

[rpc_endpoints]
anvil = "${ANVIL_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 11155111 }
