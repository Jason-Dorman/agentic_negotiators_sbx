# Compose profile: local (docs/architecture.md section 4).
#
# Stage 0 brought up the two dependencies the rest of the stack is built against: PostgreSQL 16
# and an Anvil chain on 31337. Stage 2.5 adds the application: a one-shot `deploy` that puts the
# contracts on the Anvil, the two agent instances, and the `api`. The web service arrives in
# stage 4. `make up` starts only PostgreSQL and Anvil, which is all the test suites need; `make
# stack` starts everything, reading infra/.env (docs/runbook.md section 8).
#
# Isolation from the operator's other projects is deliberate and has four parts: the Compose
# project name `agent_negotiation` (see compose.yaml), a volume with an explicit project-scoped
# name, a database and role named for this project rather than `postgres`, and a published host
# port that defaults away from 5432. Nothing here attaches to another stack's data.
#
# Every published port binds to 127.0.0.1. Nothing here is reachable from the network without a
# deliberate change and the review in docs/security_and_trust_boundaries.md section 8.1.

services:
  postgres:
    image: postgres:16.15-alpine
    profiles: ["local"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent_negotiation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent_negotiation}
      POSTGRES_DB: ${POSTGRES_DB:-agent_negotiation}
      # Deterministic collation so ordering in tests does not depend on the host locale.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      # host:container. The container port is always 5432 and nothing configurable changes it.
      # The published host port defaults to 55432 because 5432 is frequently already taken by
      # another project or a native install, which made the documented start-up command fail.
      # POSTGRES_PORT moves the host side only; set it to 5432 if that port is free for you.
      #
      # Services inside this Compose network reach the database at `postgres:5432`, the service
      # name and the container port. They never use the published host port, so changing
      # POSTGRES_PORT can never require a code change.
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-agent_negotiation} -d ${POSTGRES_DB:-agent_negotiation}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - backend
    restart: unless-stopped

  anvil:
    image: ghcr.io/foundry-rs/foundry:v1.8.3
    profiles: ["local"]
    # The image ships every Foundry binary; pick one explicitly.
    entrypoint: ["anvil"]
    command:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8545"
      - "--chain-id"
      - "31337"
      - "--accounts"
      - "10"
      - "--balance"
      - "10000"
      # Anvil's published test mnemonic. These keys are worthless by construction and are the
      # reason the local profile needs no keystore password
      # (ADR-023, docs/security_and_trust_boundaries.md section 7).
      - "--mnemonic"
      - "test test test test test test test test test test test junk"
    ports:
      # Same rule as PostgreSQL: services inside the network use `anvil:8545`.
      - "127.0.0.1:${ANVIL_PORT:-8545}:8545"
    healthcheck:
      test: ["CMD", "cast", "block-number", "--rpc-url", "http://127.0.0.1:8545"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - backend
    restart: unless-stopped

  # The contracts, deployed each time the Anvil starts empty (Q57). Writes the manifest to the
  # `deployments` volume and exits; `api` starts only once it has succeeded.
  deploy:
    image: ghcr.io/foundry-rs/foundry:v1.8.3
    profiles: ["local"]
    # Root inside the container so it can write the fresh named volumes; nothing is mounted
    # writable from the host.
    user: root
    entrypoint: ["/bin/sh", "/src/infra/scripts/compose_deploy.sh"]
    environment:
      ANVIL_RPC_URL_CONTAINER: http://anvil:8545
      # Read only to learn the two addresses the deployment records and funds (ADR-023).
      RELAY_PRIVATE_KEY: ${RELAY_PRIVATE_KEY:-}
      OPERATOR_PRIVATE_KEY: ${OPERATOR_PRIVATE_KEY:-}
    volumes:
      - ../contracts:/src/contracts:ro
      - ./scripts/compose_deploy.sh:/src/infra/scripts/compose_deploy.sh:ro
      - deployments:/deployments
      # The solc binary, kept between runs so a restart does not download it again.
      - foundry-svm:/root/.svm
    depends_on:
      anvil:
        condition: service_healthy
    networks:
      - backend
    restart: "no"

  # One image, two instances, configured apart: each receives its own root and its own shared
  # secret and never the other's (ADR-039). Each joins its own internal network, which only the api
  # also joins, so an agent is reachable from the api and from nothing else — not the other agent —
  # and reaches nothing outside.
  agent-a:
    build:
      context: ..
      dockerfile: services/agent/Dockerfile
    image: agent-negotiation/agent:local
    profiles: ["local"]
    environment:
      AGENT_ROLE: buyer
      AGENT_INSTANCE: agent-a
      AGENT_PORT: "8101"
      AGENT_ROOT_KEY_REF: ${BUYER_ROOT_KEY_REF:-}
      BUYER_ROOT_KEY: ${BUYER_ROOT_KEY:-}
      AGENT_SHARED_SECRET: ${AGENT_A_SHARED_SECRET:-}
      AGENT_SETUP_GAS_LIMIT_MAX: ${AGENT_SETUP_GAS_LIMIT_MAX:-100000}
      AGENT_SETUP_MAX_COST_WEI: ${AGENT_SETUP_MAX_COST_WEI:-10000000000000000}
      AGENT_LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "python", "-m", "agent.healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - agent-a
    restart: unless-stopped

  agent-b:
    build:
      context: ..
      dockerfile: services/agent/Dockerfile
    image: agent-negotiation/agent:local
    profiles: ["local"]
    environment:
      AGENT_ROLE: seller
      AGENT_INSTANCE: agent-b
      AGENT_PORT: "8102"
      AGENT_ROOT_KEY_REF: ${SELLER_ROOT_KEY_REF:-}
      SELLER_ROOT_KEY: ${SELLER_ROOT_KEY:-}
      AGENT_SHARED_SECRET: ${AGENT_B_SHARED_SECRET:-}
      AGENT_SETUP_GAS_LIMIT_MAX: ${AGENT_SETUP_GAS_LIMIT_MAX:-100000}
      AGENT_SETUP_MAX_COST_WEI: ${AGENT_SETUP_MAX_COST_WEI:-10000000000000000}
      AGENT_LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "python", "-m", "agent.healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - agent-b
    restart: unless-stopped

  # The backend. It holds the relay and operator keys and the agents' shared secrets, and only the
  # references to the agents' roots, never the roots themselves.
  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    image: agent-negotiation/api:local
    profiles: ["local"]
    environment:
      DATABASE_URL: ${DATABASE_URL_CONTAINER:-postgresql+asyncpg://agent_negotiation:agent_negotiation@postgres:5432/agent_negotiation}
      AUTO_MIGRATE: "true"
      DEPLOYMENT_MANIFEST: /deployments/local-compose.json
      RPC_PROVIDER: anvil
      CHAIN_RPC_URL: http://anvil:8545
      RPC_TIMEOUT_S: ${RPC_TIMEOUT_S:-10}
      CONFIRMATION_THRESHOLD: ${CONFIRMATION_THRESHOLD:-1}
      INDEXER_POLL_INTERVAL_S: ${INDEXER_POLL_INTERVAL_S:-1}
      RELAY_KEY_REF: ${RELAY_KEY_REF:-env:RELAY_PRIVATE_KEY}
      RELAY_PRIVATE_KEY: ${RELAY_PRIVATE_KEY:-}
      OPERATOR_KEY_REF: ${OPERATOR_KEY_REF:-env:OPERATOR_PRIVATE_KEY}
      OPERATOR_PRIVATE_KEY: ${OPERATOR_PRIVATE_KEY:-}
      AGENT_A_URL: http://agent-a:8101
      AGENT_B_URL: http://agent-b:8102
      AGENT_A_SHARED_SECRET: ${AGENT_A_SHARED_SECRET:-}
      AGENT_B_SHARED_SECRET: ${AGENT_B_SHARED_SECRET:-}
      BUYER_ROOT_KEY_REF: ${BUYER_ROOT_KEY_REF:-}
      SELLER_ROOT_KEY_REF: ${SELLER_ROOT_KEY_REF:-}
      AGENT_SETUP_GAS_LIMIT_MAX: ${AGENT_SETUP_GAS_LIMIT_MAX:-100000}
      SOFTWARE_VERSION: ${SOFTWARE_VERSION:-0.1.0}
      OPERATOR_TOKEN: ${OPERATOR_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # The rest of the backend's tuning, each the documented default unless infra/.env says
      # otherwise (infra/.env.example).
      INDEXER_LOG_CHUNK_BLOCKS: ${INDEXER_LOG_CHUNK_BLOCKS:-2000}
      RELAY_REPLACE_AFTER_BLOCKS: ${RELAY_REPLACE_AFTER_BLOCKS:-3}
      RELAY_MAX_FEE_PER_GAS_WEI: ${RELAY_MAX_FEE_PER_GAS_WEI:-100000000000}
      RELAY_FALLBACK_GAS_LIMIT: ${RELAY_FALLBACK_GAS_LIMIT:-500000}
      RPC_OUTAGE_LIMIT_S: ${RPC_OUTAGE_LIMIT_S:-60}
      RUN_LEASE_TTL_S: ${RUN_LEASE_TTL_S:-30}
      AGENT_TIMEOUT_S: ${AGENT_TIMEOUT_S:-10}
      EVENT_POLL_INTERVAL_S: ${EVENT_POLL_INTERVAL_S:-0.25}
      SSE_KEEPALIVE_S: ${SSE_KEEPALIVE_S:-15}
      IDEMPOTENCY_RETENTION_H: ${IDEMPOTENCY_RETENTION_H:-24}
      IDEMPOTENCY_CLAIM_TIMEOUT_S: ${IDEMPOTENCY_CLAIM_TIMEOUT_S:-60}
    ports:
      # Published on 127.0.0.1 only, like every port here (ADR-028).
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - deployments:/deployments:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      anvil:
        condition: service_healthy
      deploy:
        condition: service_completed_successfully
      agent-a:
        condition: service_healthy
      agent-b:
        condition: service_healthy
    # Docker's stop grace, above the api's own five-second graceful phase (ADR-082), so its
    # lifespan gives the lease up before the container is killed.
    stop_grace_period: 15s
    networks:
      - backend
      - agent-a
      - agent-b
    restart: unless-stopped

volumes:
  postgres-data:
    # An explicit name, so the volume is `agent_negotiation_postgres_data` exactly rather than
    # the project prefix plus a generic key. It is this project's database and no other's;
    # `make reset-db` is the only thing that destroys it.
    name: agent_negotiation_postgres_data
  # The `local-compose` manifest, written by `deploy` and read by `api`.
  deployments:
    name: agent_negotiation_deployments
  foundry-svm:
    name: agent_negotiation_foundry_svm

networks:
  # Each agent joins its own network only, which the api also joins, so it is reachable from the
  # backend and from nothing else (docs/architecture.md section 4,
  # docs/security_and_trust_boundaries.md section 2).
  backend:
    driver: bridge
  agent-a:
    driver: bridge
    internal: true
  agent-b:
    driver: bridge
    internal: true
