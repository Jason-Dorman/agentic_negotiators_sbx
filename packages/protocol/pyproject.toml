[project]
name = "negotiation-protocol"
version = "0.1.0"
description = "Versioned schemas, ABI artefacts, EIP-712 fixtures and reason tables shared by every language."
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
# docs/contributing.md 1: this package imports nothing from services or apps.
dependencies = [
    "pydantic>=2.11",
    "jsonschema>=4.23",
    # The schemas cross-reference each other by file name, which needs an explicit registry
    # rather than jsonschema's default resolver. `referencing` is jsonschema's own dependency;
    # naming it here is honesty about a direct import, not a new package in the tree.
    "referencing>=0.36",
    "eth-abi>=5.2",
    "eth-account>=0.13",
    "eth-utils>=5.2",
]

[project.optional-dependencies]
# web3 lives behind an extra so that installing the protocol package does not give the
# agent service an RPC client. docs/architecture.md 3.3: the agent has no chain connection.
tools = ["web3>=7.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/negotiation_protocol"]

# docs/contributing.md section 1 puts the schemas, fixtures and ABI artefacts beside `src/`,
# because three languages read them from those paths. That leaves them outside the wheel, so an
# installed copy of this package would have the code and none of the data it exists to serve.
# Force-including them under the import package keeps both layouts working, and
# `resources.py` looks in the packaged location first.
[tool.hatch.build.targets.wheel.force-include]
"schemas" = "negotiation_protocol/schemas"
"fixtures" = "negotiation_protocol/fixtures"
"abi" = "negotiation_protocol/abi"
